[tool.poetry]
name = "backend"
version = "0.1.0"
description = "Backend for Upskill Scout"
authors = ["Fabian Skalski"]
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = ">=3.10, <3.14"
fastapi = "^0.122.0"
uvicorn = "^0.38.0"
pymilvus = "^2.6.4"
pydantic = "^2.12.5"
pydantic-settings = "^2.12.0"
requests = "^2.32.5"
mlflow = "^3.6.0"
boto3="^1.41.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
