services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "${OLLAMA_PORT}:${OLLAMA_INTERNAL_PORT}"
    volumes:
      - ollama_data:/root/.ollama
      - ./init_ollama_models.sh:/init_ollama_models.sh
    environment:
      - MODEL_GEN=${MODEL_GEN}
      - MODEL_EMB=${MODEL_EMB}
      - OLLAMA_PORT=${OLLAMA_PORT}
    networks:
      - upskill-scout-network
    depends_on:
      - fluentd
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    healthcheck:
      test: "bash -c 'cat < /dev/null > /dev/tcp/localhost/${OLLAMA_INTERNAL_PORT}'"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # Run the init script after the service starts
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /bin/ollama serve &
        /init_ollama_models.sh
        wait
    logging:
      driver: "fluentd"
      options:
        fluentd-address: "localhost:${FLUENTD_PORT}"
        mode: non-blocking
        tag: "ollama"

  llm-service:
    build:
      context: ./llm-service
      args:
        - LLM_SERVICE_INTERNAL_PORT=${LLM_SERVICE_INTERNAL_PORT}
    ports:
      - "${LLM_SERVICE_PORT}:${LLM_SERVICE_INTERNAL_PORT}"
    volumes:
      - ./llm-service:/app
    environment:
      - LLM_SERVICE_INTERNAL_PORT=${LLM_SERVICE_INTERNAL_PORT}
      - OLLAMA_BASE_URL=http://ollama:${OLLAMA_PORT}
      - MODEL_GEN=${MODEL_GEN}
      - MODEL_EMB=${MODEL_EMB}
      - EMBEDDING_DIM=${EMBEDDING_DIM}
      - PROMPT_EXTRACT=${PROMPT_EXTRACT}
      - GEN_TEMPERATURE=${GEN_TEMPERATURE}
      - GEN_MAX_TOKENS=${GEN_MAX_TOKENS}
      - GEN_TIMEOUT=${GEN_TIMEOUT}
      - EMB_TIMEOUT=${EMB_TIMEOUT}
    depends_on:
      - ollama
      - fluentd
    networks:
      - upskill-scout-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${LLM_SERVICE_INTERNAL_PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "fluentd"
      options:
        fluentd-address: "localhost:${FLUENTD_PORT}"
        mode: non-blocking
        tag: "llm-service"

  backend:
    build:
      context: ./backend
      args:
        - BACKEND_INTERNAL_PORT=${BACKEND_INTERNAL_PORT}
    ports:
      - "${BACKEND_PORT}:${BACKEND_INTERNAL_PORT}"
    volumes:
      - ./backend:/app
      - ./dummy_data:/app/dummy_data
    environment:
      - BACKEND_INTERNAL_PORT=${BACKEND_INTERNAL_PORT}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_RETRIES=${REDIS_RETRIES}
      - REDIS_DB=${REDIS_DB}
      - MILVUS_URI=${MILVUS_URI}
      - MILVUS_DB_NAME=${MILVUS_DB_NAME}
      - MILVUS_COLLECTION_NAME=${MILVUS_COLLECTION_NAME}
      - LLM_SERVICE_URL=${LLM_SERVICE_URL}
      - EMBEDDING_DIM=${EMBEDDING_DIM}
    depends_on:
      - redis
      - llm-service
      - milvus_standalone
      - fluentd
    networks:
      - upskill-scout-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${BACKEND_INTERNAL_PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "fluentd"
      options:
        fluentd-address: "localhost:${FLUENTD_PORT}"
        mode: non-blocking
        tag: "backend"

  redis:
    image: redis:alpine
    ports:
      - "${REDIS_PORT}:${REDIS_INTERNAL_PORT}"
    volumes:
      - redis_data:/data
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      - upskill-scout-network
    depends_on:
      - fluentd
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "fluentd"
      options:
        fluentd-address: "localhost:${FLUENTD_PORT}"
        mode: non-blocking
        tag: "redis"

  redisinsight:
    image: redislabs/redisinsight
    ports:
      - "${REDISINSIGHT_PORT}:${REDISINSIGHT_INTERNAL_PORT}"
    volumes:
      - redisinsight_data:/db
    depends_on:
      - redis
      - fluentd
    restart: always
    networks:
      - upskill-scout-network
    logging:
      driver: "fluentd"
      options:
        fluentd-address: "localhost:${FLUENTD_PORT}"
        mode: non-blocking
        tag: "redisinsight"

  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:${ETCD_PORT} -listen-client-urls http://0.0.0.0:${ETCD_PORT} --data-dir /etcd
    depends_on:
      - fluentd
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - upskill-scout-network
    logging:
      driver: "fluentd"
      options:
        fluentd-address: "localhost:${FLUENTD_PORT}"
        mode: non-blocking
        tag: "etcd"

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
    ports:
      - "${MINIO_CONSOLE_PORT}:${MINIO_CONSOLE_PORT}"
      - "${MINIO_API_PORT}:${MINIO_API_PORT}"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":${MINIO_CONSOLE_PORT}"
    depends_on:
      - fluentd
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MINIO_API_PORT}/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - upskill-scout-network
    logging:
      driver: "fluentd"
      options:
        fluentd-address: "localhost:${FLUENTD_PORT}"
        mode: non-blocking
        tag: "minio"

  milvus_standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.3.21
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      - ETCD_ENDPOINTS=${ETCD_ENDPOINTS}
      - MINIO_ADDRESS=${MINIO_ADDRESS}
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MILVUS_METRICS_PORT}/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "${MILVUS_PORT}:${MILVUS_PORT}"
      - "${MILVUS_METRICS_PORT}:${MILVUS_METRICS_PORT}"
    depends_on:
      - etcd
      - minio
      - fluentd
    networks:
      - upskill-scout-network
    logging:
      driver: "fluentd"
      options:
        fluentd-address: "localhost:${FLUENTD_PORT}"
        mode: non-blocking
        tag: "milvus_standalone"

  attu:
    container_name: attu
    image: zilliz/attu:v2.3.10
    environment:
      - MILVUS_URL=${MILVUS_URI}
      - MILVUS_DB_NAME=${MILVUS_DB_NAME}
    ports:
      - "${ATTU_PORT}:${ATTU_INTERNAL_PORT}"
    depends_on:
      - milvus_standalone
      - fluentd
    networks:
      - upskill-scout-network
    logging:
      driver: "fluentd"
      options:
        fluentd-address: "localhost:${FLUENTD_PORT}"
        mode: non-blocking
        tag: "attu"

  fluentd:
    image: fluent/fluentd:v1.16-1
    container_name: fluentd
    volumes:
      - ./fluentd/conf:/fluentd/etc
    ports:
      - "${FLUENTD_PORT}:${FLUENTD_PORT}"
      - "${FLUENTD_PORT}:${FLUENTD_PORT}/udp"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - upskill-scout-network

  postgres:
    image: postgres:13
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - upskill-scout-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 5s
      retries: 5
    depends_on:
      - fluentd
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_INTERNAL_PORT}" 
    volumes:
      - postgres_data:/var/lib/postgresql/data

  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    environment:
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
      - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:${REDIS_PORT}/0
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY}
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=false
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - _AIRFLOW_DB_UPGRADE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=${AIRFLOW_WWW_USER_USERNAME}
      - _AIRFLOW_WWW_USER_PASSWORD=${AIRFLOW_WWW_USER_PASSWORD}
    depends_on:
      - postgres
      - redis
      - fluentd
    networks:
      - upskill-scout-network
    command: version

  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    restart: always
    depends_on:
      - postgres
      - redis
      - airflow-init
      - fluentd
    environment:
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
      - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:${REDIS_PORT}/0
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY}
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=false
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth
      - AIRFLOW__WEBSERVER__WORKERS=1
      - AIRFLOW__WEBSERVER__WORKER_REFRESH_INTERVAL=1800
      - AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT=300
    volumes:
      - ./dags:/opt/airflow/dags
      - ./airflow_tasks:/opt/airflow/airflow_tasks
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    ports:
      - "${AIRFLOW_WEBSERVER_PORT}:${AIRFLOW_WEBSERVER_INTERNAL_PORT}"
    networks:
      - upskill-scout-network
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:${AIRFLOW_WEBSERVER_INTERNAL_PORT}/health"]
      interval: 10s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    restart: always
    depends_on:
      - postgres
      - redis
      - airflow-init
      - fluentd
    environment:
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
      - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:${REDIS_PORT}/0
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY}
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=false
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth
      # Worker env vars for tasks
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_DB=${REDIS_DB}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_RETRIES=${REDIS_RETRIES}
      - MILVUS_URI=${MILVUS_URI}
      - MILVUS_DB_NAME=${MILVUS_DB_NAME}
      - MILVUS_COLLECTION_NAME=${MILVUS_COLLECTION_NAME}
      - LLM_SERVICE_URL=${LLM_SERVICE_URL}
      - EMBEDDING_DIM=${EMBEDDING_DIM}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./airflow_tasks:/opt/airflow/airflow_tasks
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - upskill-scout-network
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-worker:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    restart: always
    depends_on:
      - postgres
      - redis
      - airflow-init
      - fluentd
    environment:
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
      - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:${REDIS_PORT}/0
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY}
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=false
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth
      # Worker env vars for tasks
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_DB=${REDIS_DB}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_RETRIES=${REDIS_RETRIES}
      - MILVUS_URI=${MILVUS_URI}
      - MILVUS_DB_NAME=${MILVUS_DB_NAME}
      - MILVUS_COLLECTION_NAME=${MILVUS_COLLECTION_NAME}
      - LLM_SERVICE_URL=${LLM_SERVICE_URL}
      - EMBEDDING_DIM=${EMBEDDING_DIM}
      - PYTHONPATH=/opt/airflow/airflow_tasks
      # Limit concurrency to prevent OOM with 1G memory limit
      - AIRFLOW__CELERY__WORKER_CONCURRENCY=1
    volumes:
      - ./dags:/opt/airflow/dags
      - ./airflow_tasks:/opt/airflow/airflow_tasks
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    networks:
      - upskill-scout-network
    command: celery worker
    healthcheck:
      test: ["CMD-SHELL", "celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d celery@$${HOSTNAME}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  milvus_data:
  redis_data:
  redisinsight_data:
  ollama_data:
  postgres_data:

networks:
  upskill-scout-network:
    driver: bridge
